name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build demo pack
        run: python -m georesponse.datapack
      - name: Test
        run: python -m pytest -q
      - name: Doctor (wiring check)
        run: python -m georesponse.cli doctor || true
      - name: CLI smoke
        run: |
          python -m georesponse.cli report
          python -m georesponse.cli connectors
          python -m georesponse.cli verify --path runtime/audit.jsonl

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint:design
      - run: npm run build
      - run: npm run budget
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: End-to-end and axe
        run: npm run e2e -- --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
