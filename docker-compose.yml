services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: georesponse
      POSTGRES_PASSWORD: georesponse
      POSTGRES_DB: georesponse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql/postgres_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georesponse"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: .
    env_file: .env
    environment:
      GEORESPONSE_MODE: production
      GEORESPONSE_POSTGRES_DSN: postgresql://georesponse:georesponse@postgres:5432/georesponse
      GEORESPONSE_REDIS_URL: redis://redis:6379/0
      GEORESPONSE_S3_ENDPOINT: http://minio:9000
      GEORESPONSE_S3_BUCKET: georesponse
      GEORESPONSE_S3_ACCESS_KEY: minioadmin
      GEORESPONSE_S3_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "georesponse.production.worker"]
    env_file: .env
    environment:
      GEORESPONSE_MODE: production
      GEORESPONSE_POSTGRES_DSN: postgresql://georesponse:georesponse@postgres:5432/georesponse
      GEORESPONSE_REDIS_URL: redis://redis:6379/0
      GEORESPONSE_S3_ENDPOINT: http://minio:9000
      GEORESPONSE_S3_BUCKET: georesponse
      GEORESPONSE_S3_ACCESS_KEY: minioadmin
      GEORESPONSE_S3_SECRET_KEY: minioadmin
      GEORESPONSE_TICK_SECONDS: "900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
